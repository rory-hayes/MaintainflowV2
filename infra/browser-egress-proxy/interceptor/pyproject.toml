[project]
name = "maintainflow-egress-interceptor"
version = "0.1.0"
description = "Fail-closed protocol policy for the Maintain Flow Browserbase egress interceptor"
requires-python = ">=3.12,<3.15"
dependencies = [
  # Keep the patched HTTP/2 parser on the exact HPACK implementation covered
  # by pinned-source.json and the upstream mitmproxy lock.
  "hpack==4.1.0",
  "mitmproxy==12.2.3",
  # Maintain Flow carries a reviewed metadata-only mitmproxy patch so the
  # security-fixed transitive releases can be locked and source-tested.
  "msgpack==1.2.1",
  "tornado==6.5.6",
]

[dependency-groups]
dev = [
  # Match the exact upstream test environment used to verify the parser patch.
  "pytest==8.4.2",
]

[tool.uv]
package = false
override-dependencies = [
  "msgpack==1.2.1",
  "tornado==6.5.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
